<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="yg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF1A1A"/>
      <stop offset="1" stop-color="#CC0000"/>
    </linearGradient>
    <filter id="ys" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#FF0000" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#ys)">
    <!-- Outer badge matching 512x512 circular container (r=196, cx=256, cy=240) -->
    <circle cx="256" cy="240" r="196" fill="url(#yg)"/>
    <circle cx="256" cy="240" r="172" fill="none" stroke="#FF4D4D" stroke-width="12" opacity=".7"/>
    
    <!-- Central YouTube Rounded Rectangle and Play Triangle -->
    <rect x="146" y="162" width="220" height="156" rx="46" fill="#FFFFFF"/>
    <polygon points="236,206 292,240 236,274" fill="#FF0000"/>
  </g>
</svg>
